<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Student Performance Prediction{% endblock %}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='bootstrap.min.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
<script src="{{ url_for('static', filename='chart.min.js') }}"></script>
</head>
<body>
<nav class="navbar navbar-expand-md navbar-dark mb-4 no-print">
  <div class="container">
    <a class="navbar-brand fw-semibold" href="/">&#127891; Student Performance Predictor</a>
    <button class="navbar-toggler" type="button" onclick="document.getElementById('nav').classList.toggle('show')">
      <span class="navbar-toggler-icon"></span></button>
    <div class="collapse navbar-collapse" id="nav">
      <ul class="navbar-nav ms-auto">
        {% for url, text in [('/', 'Predict'), ('/batch', 'Batch Upload'), ('/history', 'History'), ('/dashboard', 'Dashboard')] %}
        <li class="nav-item"><a class="nav-link {% if request.path == url %}active{% endif %}" href="{{ url }}">{{ text }}</a></li>
        {% endfor %}
      </ul>
    </div>
  </div>
</nav>
<main class="container pb-5">{% block content %}{% endblock %}</main>
<footer class="text-center text-muted small pb-4 no-print">
  Mini Project &middot; Dept. of CSE, Chaitanya (Deemed to be University)
</footer>
</body>
</html>
